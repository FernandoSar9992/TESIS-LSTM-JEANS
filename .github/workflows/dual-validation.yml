name: Comprobaciones de pronostico dual

on:
  push:
    branches: [mejora-lstm-maquila-corte]
  pull_request:
    branches: [main]

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias minimas para pruebas
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<3"
      - name: Compilar todos los modulos Python
        run: python -m compileall -q .
      - name: Pruebas unitarias de demanda y pronostico dual
        run: |
          python -m unittest discover -s tests -p "test_dual_forecast.py" -v
          python -m unittest discover -s tests -p "test_seasonal_features.py" -v
          python -m unittest discover -s tests -p "test_seasonal_diagnostics.py" -v
          python -m unittest discover -s tests -p "test_validation_audit.py" -v
