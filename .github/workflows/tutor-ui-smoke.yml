name: Smoke académico V9 y validación cruzada

on:
  push:
    branches:
      - v9-presentacion-tutor-cv-20261110
      - lstm-produccion-final
  workflow_dispatch:

jobs:
  interfaz-tutor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar librerías de interfaz sin TensorFlow
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'streamlit>=1.40,<2' 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'plotly>=5.24,<7' 'openpyxl>=3.1,<4'
      - name: Validar coherencia del informe y rutas de páginas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from streamlit.testing.v1 import AppTest
          root=Path('.')
          for path in ['ui_tesis.py','app.py','pages/5_Validacion_Cruzada_V9.py','pages/6_Informe_Academico_V9.py']:
              assert (root/path).is_file(), path
              compile((root/path).read_text(encoding='utf8'),path,'exec')
          r=json.loads((root/'results/cv_v9_resumen_tutor.json').read_text(encoding='utf8'))
          mq=r['modalidades']['MQ']; cp=r['modalidades']['CP']
          assert mq['n_folds']==3 and cp['n_folds']==2
          assert len(mq['folds'])==3 and len(cp['folds'])==2
          assert sum(x['semanas'] for x in (mq,cp))==60
          print('Archivos, resumen y métricas: OK')
          app=AppTest.from_file('pages/6_Informe_Academico_V9.py', default_timeout=80).run()
          if app.exception:
              raise RuntimeError(str([x.message for x in app.exception]))
          print('Informe académico Streamlit: OK')
          PY